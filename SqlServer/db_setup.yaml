---
# Required: community.postgresql
- name: Install MySql
  hosts: dbservers
  become: true
  tasks:
    # Ubuntu comes with MySql, but images can be very strange on OpenStack and so we ensure
    # that we are getting the most up to date version we can.
    - name: Install MySql Package
      ansible.builtin.apt:
        name: postgresql-common
        state: present
        state: present

    - name: Run MySql Setup Script
      ansible.builtin.shell:
        cmd: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh

    # Version requirement from https://docs.ansible.com/projects/ansible/latest/collections/community/postgresql/postgresql_query_module.html
    - name: Install pyscopg2 to remote
      ansible.builtin.pip:
        name: psycopg2>=2.5.1 

- name: Configure PostgreSQL User and DB
  hosts: dbservers
  become: yes
  beocme_user: postgres
  vars:
    db_user: "{{ lookup('ansible.builtin.env', 'DB_USER') | default('bravo', true) }}"
    db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
    db_name: "{{ lookup('ansible.builtin.env', 'DB_NAME') | default('bravo', true) }}"

  tasks:
    - name: Confirm Password Presence
      ansible.builtin.fail:
        msg: "DB_PASSWORD environment variable is not set. Did you run `source .env`?"
      when: db_password == ""

    - name: Create Database User
      community.postgresql.postgresql_user:
        name: "{{  db_user }}"
        password: "{{ db_password }}"
        role_attr_flags: "NOSUPERUSER,CREATEDB"
        state: present

    - name: Create Database and Assign Owner
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present
