---
# First-run configuration for the competition's AD-backed Bubblechat server.
- name: Install and configure Openfire
  hosts: bubblechat
  gather_facts: false

  vars:
    # Keep the installer version and its published SHA-256 digest together.
    java_url: https://api.adoptium.net/v3/installer/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk
    openfire_url: https://download.igniterealtime.org/openfire/openfire_5_1_2_x64.exe
    openfire_checksum: 5e52d57fb9e20235ed31a6809c3ecd139fb6583c0b24575cab3459ad4ff0b0a1
    openfire_path: 'C:\Program Files\Openfire'
    openfire_config_path: '{{ openfire_path }}\conf\openfire.xml'
    # XMPP addresses use krusty.krab; bubblechat.krusty.krab is the server's DNS name.
    openfire_xmpp_domain: krusty.krab
    openfire_hostname: bubblechat.krusty.krab
    openfire_host_ip: 10.111.2.4
    # StartTLS on LDAP port 389 protects credentials before the simple bind.
    openfire_ldap_host: treedome.krusty.krab
    openfire_ldap_port: 389
    openfire_ldap_base_dn: DC=krusty,DC=krab
    # Blue Team Domain Admin selected as the LDAP bind identity for this install.
    openfire_ldap_bind_dn: CN=mrkrabs,CN=Users,DC=KRUSTY,DC=KRAB
    openfire_ldap_bind_password: 'Patty321!'
    # Connect to Bubblechat by IP over WinRM with NTLM message encryption.
    ansible_host: 10.111.2.4
    ansible_connection: winrm
    ansible_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_transport: ntlm
    ansible_winrm_message_encryption: always
    ansible_user: 'KRUSTY\mrkrabs'
    ansible_password: '{{ openfire_ldap_bind_password }}'
    # Grey Team and the three designated Blue Team AD users can administer Openfire.
    openfire_admin_users:
      - kingneptune
      - paintythepirate
      - Mrkrabs
      - Spongebob
      - Squidward
  tasks:
    - name: Verify WinRM connection to Bubblechat
      ansible.windows.win_ping:
      tags: [connection_check]

    # The XMPP domain becomes part of every user's address after first-run setup.
    - name: Validate the XMPP domain
      ansible.builtin.assert:
        that:
          - openfire_xmpp_domain is defined
          - openfire_xmpp_domain | default('') | trim | length > 0
        fail_msg: >-
          Supply the XMPP domain that scoring clients will use.
        quiet: true

    - name: Require LDAP bind credentials
      ansible.builtin.assert:
        that:
          - openfire_ldap_bind_dn | default('') | trim | length > 0
          - openfire_ldap_bind_password | default('') | length > 0
        fail_msg: >-
          Set openfire_ldap_bind_dn and openfire_ldap_bind_password before
          installing Openfire.
        quiet: true
      tags: [ldap_check]

    - name: Wait for the domain controller's LDAP listener
      ansible.windows.win_wait_for:
        host: '{{ openfire_ldap_host }}'
        port: '{{ openfire_ldap_port }}'
        state: started
        timeout: 30
      tags: [ldap_check]

    - name: Verify the StartTLS bind and five AD administrator accounts
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          param(
              [string]$Server,
              [int]$Port,
              [string]$BaseDN,
              [string]$AdminUsersJson,
              [PSCredential]$BindCredential
          )

          Add-Type -AssemblyName System.DirectoryServices.Protocols
          $identifier = [System.DirectoryServices.Protocols.LdapDirectoryIdentifier]::new($Server, $Port, $true, $false)
          $connection = [System.DirectoryServices.Protocols.LdapConnection]::new(
              $identifier,
              $BindCredential.GetNetworkCredential(),
              [System.DirectoryServices.Protocols.AuthType]::Basic
          )
          $connection.AutoBind = $false
          $connection.SessionOptions.ProtocolVersion = 3
          $connection.SessionOptions.SecureSocketLayer = $false
          $connection.Timeout = [TimeSpan]::FromSeconds(10)

          try {
              $connection.SessionOptions.StartTransportLayerSecurity($null)
              $connection.Bind()
              foreach ($username in (ConvertFrom-Json -InputObject $AdminUsersJson)) {
                  $escaped = $username.Replace('\', '\5c').Replace('*', '\2a').Replace('(', '\28').Replace(')', '\29')
                  $filter = "(&(objectCategory=person)(objectClass=user)(sAMAccountName=$escaped))"
                  $request = [System.DirectoryServices.Protocols.SearchRequest]::new(
                      $BaseDN,
                      $filter,
                      [System.DirectoryServices.Protocols.SearchScope]::Subtree,
                      [string[]]@('distinguishedName')
                  )
                  $response = $connection.SendRequest($request)
                  if ($response.Entries.Count -ne 1) {
                      throw "Expected one AD user named '$username' below '$BaseDN'; found $($response.Entries.Count)."
                  }
              }
          }
          finally {
              $connection.Dispose()
          }
          $Ansible.Changed = $false
        parameters:
          Server: '{{ openfire_ldap_host }}'
          Port: '{{ openfire_ldap_port }}'
          BaseDN: '{{ openfire_ldap_base_dn }}'
          AdminUsersJson: '{{ openfire_admin_users | to_json }}'
        sensitive_parameters:
          - name: BindCredential
            username: '{{ openfire_ldap_bind_dn }}'
            password: '{{ openfire_ldap_bind_password }}'
      tags: [ldap_check]

    - name: Install Java 17 JRE
      ansible.windows.win_package:
        path: '{{ java_url }}'
        state: present
        arguments: 'ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJavaHome INSTALLDIR="C:\Program Files\Temurin"'

    - name: Install Openfire 5.1.2
      ansible.windows.win_package:
        path: '{{ openfire_url }}'
        checksum: '{{ openfire_checksum }}'
        checksum_algorithm: sha256
        arguments: '-q'
        state: present
        creates_path: '{{ openfire_path }}\bin\openfire-service.exe'
        wait_for_children: true

    # Openfire's installer starts the service. Only an unconfigured server should
    # receive the first-run XML template; replacing it later would risk its data.
    - name: Check whether Openfire has completed first-run setup
      ansible.windows.win_powershell:
        script: |
          $configPath = '{{ openfire_config_path }}'
          $setupComplete = $false
          if (Test-Path -LiteralPath $configPath) {
              [xml]$config = Get-Content -LiteralPath $configPath -Raw
              $setupComplete = [string]$config.jive.setup -eq 'true'
          }
          $Ansible.Result = @{ setup_complete = $setupComplete }
          $Ansible.Changed = $false
      register: openfire_setup_state

    - name: Stop Openfire before first-run configuration
      ansible.windows.win_service:
        name: Openfire
        state: stopped
      when: not openfire_setup_state.result.setup_complete

    # The template contains the LDAP bind password; hide it from task logs.
    - name: Provision first-run Openfire settings with AD authentication
      ansible.windows.win_template:
        src: templates/openfire.xml.j2
        dest: '{{ openfire_config_path }}'
        backup: false
      when: not openfire_setup_state.result.setup_complete
      no_log: true

    - name: Set Openfire service heap limit to 1 GB
      ansible.windows.win_copy:
        content: "-Xmx1024m\n"
        dest: '{{ openfire_path }}\bin\openfire-service.vmoptions'
      register: openfire_vmoptions

    # The initial start reads the new VM options. On an existing setup, restart
    # only when those options changed, leaving routine reruns uninterrupted.
    - name: Start Openfire after first-run configuration
      ansible.windows.win_service:
        name: Openfire
        state: started
        start_mode: auto
      when: not openfire_setup_state.result.setup_complete

    - name: Restart Openfire if service options changed on an existing server
      ansible.windows.win_service:
        name: Openfire
        state: restarted
        start_mode: auto
      when:
        - openfire_setup_state.result.setup_complete
        - openfire_vmoptions.changed

    - name: Ensure Openfire runs automatically after a reboot
      ansible.windows.win_service:
        name: Openfire
        state: started
        start_mode: auto

    # Clients reach XMPP and HTTP chat over the network. The admin console also
    # accepts remote HTTP connections on 9090, so all three ports need rules.
    - name: Allow XMPP clients through Windows Firewall
      community.windows.win_firewall_rule:
        name: Openfire XMPP 5222
        localport: 5222
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Allow HTTP chat clients through Windows Firewall
      community.windows.win_firewall_rule:
        name: Openfire HTTP chat 7070
        localport: 7070
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Allow HTTP admin console through Windows Firewall
      community.windows.win_firewall_rule:
        name: Openfire HTTP admin 9090
        localport: 9090
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    # Port checks prove the listeners opened; the following requests also check
    # the admin page and establish a BOSH session for the configured domain.
    - name: Wait for XMPP, HTTP chat, and local admin console
      ansible.windows.win_wait_for:
        host: 127.0.0.1
        port: '{{ item }}'
        state: started
        timeout: 120
      loop:
        - 5222
        - 7070
        - 9090

    - name: Verify first-run setup completed
      ansible.windows.win_powershell:
        script: |
          [xml]$config = Get-Content -LiteralPath '{{ openfire_config_path }}' -Raw
          if ([string]$config.jive.setup -ne 'true') {
              throw 'Openfire first-run setup did not complete.'
          }
          $Ansible.Changed = $false

    - name: Verify the HTTP admin login is available on Bubblechat's network address
      ansible.windows.win_uri:
        url: 'http://{{ openfire_host_ip }}:9090/login.jsp'
        method: GET
        status_code: 200
        use_proxy: false

    - name: Verify the HTTP BOSH endpoint accepts the configured XMPP domain
      ansible.windows.win_uri:
        url: http://127.0.0.1:7070/http-bind/
        method: POST
        content_type: text/xml; charset=utf-8
        body: >-
          <body rid="1" xmlns="http://jabber.org/protocol/httpbind"
          to="{{ openfire_xmpp_domain | e }}" xml:lang="en"
          wait="60" hold="1" ver="1.6"/>
        return_content: true
        status_code: 200
        use_proxy: false
      register: openfire_bosh_response
      retries: 12
      delay: 5
      until: openfire_bosh_response.content | default('') is search('sid=')

    - name: Confirm BOSH returned a session identifier
      ansible.builtin.assert:
        that:
          - openfire_bosh_response.content is search('sid=')
        fail_msg: Openfire responded on port 7070 but did not establish a BOSH session.
        quiet: true
