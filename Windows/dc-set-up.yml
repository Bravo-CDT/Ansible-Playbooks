
---
- name: Promote WinServ 2019 to DC
  hosts: windows-dc
  vars:
    safe_mode_password: "Password123!" #Replace with a secure password
    domain_name: bravo.local # Repace with a theme name
    netbios_name: BRAVO # Repace with a theme name
    grey_team_users_password: "Password123!" #Replace with a secure password
    blue_team_admins_password: "Patty321!" #Replace with a secure password
    blue_team_users_password: "Patty321!" #Replace

  tasks:
    - name: Install ADDS feature
      ansible.windows.win_feature:
        name:
          - AD-Domain-Services\
          - RSAT-AD-Tools
          - RSAT-ADDS
        state: present
        include_management_tools: yes

    - name: Create a new AD forest
      ansible.windows.win_domain:
        dns_domain_name: "{{ domain_name }}"
        domain_netbios_name: "{{ netbios_name }}"
        safe_mode_password: "{{ safe_mode_password }}"
        state: domain
        install_dns: true
      register: domain_setup

    - name: Reboot after domain creation
      ansible.windows.win_reboot:
        reboot_timeout: 900
        post_reboot_delay: 120
      when: domain_setup.reboot_required

    - name: Wait for the server to come back online
      ansible.windows.win_wait_for:
        port: 5986
        delay: 10
        timeout: 300
    
    - name: Verify domain controller promotion
      ansible.windows.win_shell: |
        Get-ADDomainController -Filter * | Select-Object Name, Domain, Site
      register: dc_info

    - name: Display domain controller information
      ansible.builtin.debug:
        var: dc_info.stdout_lines 
    
    - name: if domain is not created, fail the playbook
      ansible.builtin.fail:
        msg: "Domain controller promotion failed. Please check the logs."
      when: dc_info.stdout_lines | length == 0

    # Grey Team Domain Users
    - name: Create Grey Team Domain Users
      microsoft.ad.user:
        identity: "{{ item.identity }}"
        firstname: "{{ item.firstname }}"
        surname: "{{ item.surname }}"
        upn: "{{ item.identity }}@{{ domain_name }}"
        description: "This is a Grey Team user account. Please do not delete or modify this account."
        protect_from_deletion: true
        path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
        password: "{{ item.password }}"
        password_never_expires: true
        user_cannot_change_password: false
        enabled: true
        state: present
        groups:
          add:
            - "Domain Admins"
            - "Enterprise Admins"
            - "Schema Admins"
      loop:
        - { identity: "kingneptune", firstname: "King", surname: "Neptune", password: "{{ grey_team_users_password }}" } # REPLACE WITH SECURE PASSWORD
        - { identity: "paintythepirate", firstname: "Paint", surname: "The Pirate", password: "{{ grey_team_users_password }}" } # REPLACE WITH SECURE PASSWORD

    # Blue Team Domain Admins
    - name: Create Blue Team Domain Admins
      microsoft.ad.user:
        identity: "{{ item.identity }}"
        firstname: "{{ item.firstname }}"
        surname: "{{ item.surname }}"
        upn: "{{ item.identity }}@{{ domain_name }}"
        description: "{{ item.description }}"
        path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
        password: "{{ item.password }}"
        password_never_expires: true
        user_cannot_change_password: false
        enabled: true
        state: present
        groups:
          add:
            - "Domain Admins"
            - "Enterprise Admins"
            - "Schema Admins"
      loop:
        - { identity: "mrkrabs", firstname: "Eugene", surname: "Krabs", password: "{{ blue_team_admins_password }}", description: "Owner of the Krusty Krab. Protects the secret Krabby Patty formula and company profits." } # REPLACE WITH SECURE PASSWORD
        - { identity: "spongebob", firstname: "SpongeBob", surname: "SquarePants", password: "{{ blue_team_admins_password }}", description: "Head fry cook at the Krusty Krab. Dedicated to preparing the perfect Krabby Patty." } # REPLACE WITH SECURE PASSWORD
        - { identity: "squidward", firstname: "Squidward", surname: "Tentacles", password: "{{ blue_team_admins_password }}", description: "Krusty Krab cashier and aspiring clarinet musician. Reluctantly handles customer service." } # REPLACE WITH SECURE PASSWORD
        - { identity: "patrick", firstname: "Patrick", surname: "Star", password: "{{ blue_team_admins_password }}", description: "Bikini Bottom resident and SpongeBob's best friend. Expert in doing absolutely nothing." } # REPLACE WITH SECURE PASSWORD
        - { identity: "sandy", firstname: "Sandra", surname: "Cheeks", password: "{{ blue_team_admins_password }}", description: "Texas-born scientist and karate expert. Conducts underwater research in her treedome." } # REPLACE WITH SECURE PASSWORD

    # Blue Team Domain Users 
    - name: Create Blue Team Domain Admins
      microsoft.ad.user:
        identity: "{{ item.identity }}"
        firstname: "{{ item.firstname }}"
        surname: "{{ item.surname }}"
        upn: "{{ item.identity }}@{{ domain_name }}"
        description: "{{ item.description }}"
        path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
        password: "{{ item.password }}"
        password_never_expires: true
        user_cannot_change_password: false
        enabled: true
        state: present
        groups:
          add:
            - "Domain Users"
      loop:
        - { identity: "gary", firstname: "Gary", surname: "Snail", password: "{{ domain_users_password }}", description: "SpongeBob's loyal pet snail. Communicates through meows and secretly possesses remarkable intelligence." }
        - { identity: "puff", firstname: "Mrs", surname: "Puff", password: "{{ domain_users_password }}", description: "Boating school instructor in Bikini Bottom. Endlessly struggles to teach SpongeBob how to drive." }
        - { identity: "larry", firstname: "Larry", surname: "Lobster", password: "{{ domain_users_password }}", description: "Muscular lifeguard at Goo Lagoon. Dedicated to fitness, beach safety, and bodybuilding." }
        - { identity: "mermaidman", firstname: "Mermaid", surname: "Man", password: "{{ domain_users_password }}", description: "Retired underwater superhero. Defends Bikini Bottom from villains alongside Barnacle Boy." }
        - { identity: "barnacleboy", firstname: "Barnacle", surname: "Boy", password: "{{ domain_users_password }}", description: "Mermaid Man's longtime superhero sidekick. Fights underwater crime while seeking greater recognition." }
