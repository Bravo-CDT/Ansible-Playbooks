---
# Host port the WordPress container is published on (loopback only, nginx forwards port 80 to it)
wordpress_port: 8080

wordpress_image: "wordpress:6-apache"
wordpress_db_image: "mariadb:10.11"

wordpress_db_name: wordpress
wordpress_db_user: wordpress
wordpress_db_password: "{{ default_password }}"
wordpress_db_root_password: "{{ default_password }}"

# Account added to the docker group
docker_user: "{{ default_user }}"
