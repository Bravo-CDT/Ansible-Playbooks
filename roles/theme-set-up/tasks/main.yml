---
# Create users
- name: Ensure sudo group exists
  ansible.builtin.group:
    name: sudo
    state: present

- name: Create user accounts with team-specific hashed passwords
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ item.password | password_hash('sha512', 'ansiblesalt') }}"
    groups: "{{ 'sudo' if item.sudo else omit }}"
    append: true
    shell: /bin/bash
    state: present
  loop: "{{ users }}"

# DNS Set Up
- name: Ensure resolved.conf.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Configure DNS server in systemd-resolved
  community.general.ini_file:
    path: /etc/systemd/resolved.conf.d/dns.conf
    section: Resolve
    option: DNS
    value: "{{ dc_ip }}"
    mode: '0644'
    create: true
  notify: Restart systemd-resolved

- name: Configure search domain in systemd-resolved
  community.general.ini_file:
    path: /etc/systemd/resolved.conf.d/dns.conf
    section: Resolve
    option: Domains
    value: "{{ search_domain }}"
    mode: '0644'
    create: true
  notify: Restart systemd-resolved

- name: Ensure systemd-resolved is enabled and running
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started
