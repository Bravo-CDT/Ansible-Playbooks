
---
- name: Install SMTP and authentication packages
  ansible.builtin.apt:
    name:
      - postfix
      - sasl2-bin
      - libsasl2-modules
    state: present
    update_cache: true

- name: Configure LDAP authentication against AD
  ansible.builtin.copy:
    dest: /etc/saslauthd.conf
    mode: "0600"
    content: |
      ldap_servers: ldap://{{ ad_server }}:389
      ldap_search_base: {{ ad_search_base }}
      ldap_bind_dn: {{ ad_bind_user }}
      ldap_password: {{ ad_bind_password }}
      ldap_filter: (sAMAccountName=%U)
      ldap_auth_method: bind
      ldap_version: 3
      ldap_referrals: no
      ldap_start_tls: no
  no_log: true

- name: Enable saslauthd
  ansible.builtin.lineinfile:
    path: /etc/default/saslauthd
    regexp: '^START='
    line: 'START=yes'

- name: Select LDAP authentication backend
  ansible.builtin.lineinfile:
    path: /etc/default/saslauthd
    regexp: '^MECHANISMS='
    line: 'MECHANISMS="ldap"'

- name: Configure Cyrus SASL for Postfix
  ansible.builtin.copy:
    dest: /etc/postfix/sasl/smtpd.conf
    content: |
      pwcheck_method: saslauthd
      mech_list: PLAIN LOGIN
    mode: "0644"

- name: Allow Postfix to access SASL
  ansible.builtin.user:
    name: postfix
    groups: sasl
    append: true

- name: Configure Postfix
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "{{ item }}"
  loop:
    - "myhostname={{ smtp_hostname }}"
    - "cyrus_sasl_config_path=/etc/postfix/sasl"
    - "smtpd_sasl_type=cyrus"
    - "smtpd_sasl_auth_enable=no"
    - "smtpd_sasl_security_options=noanonymous"
    - "smtpd_relay_restrictions=permit_mynetworks,permit_sasl_authenticated,reject_unauth_destination"

- name: Enable SMTP submission port 587
  ansible.builtin.command:
    argv:
      - postconf
      - -M
      - "submission/inet=submission inet n - n - - smtpd"

- name: Enable SMTP authentication on port 587
  ansible.builtin.command:
    argv:
      - postconf
      - -P
      - "{{ item }}"
  loop:
    - "submission/inet/syslog_name=postfix/submission"
    - "submission/inet/smtpd_sasl_auth_enable=yes"
    - "submission/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject"

- name: Start LDAP authentication service
  ansible.builtin.service:
    name: saslauthd
    state: restarted
    enabled: true

- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted
    enabled: true