---
# This playbook will install the Openfire chat server on a Windows machine.
- name: Install Java 17 JRE
  ansible.windows.win_package:
    path: "{{ java_url }}"
    state: present
    # Installs Java and configures environment variables
    arguments: 'ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJavaHome INSTALLDIR="C:\Program Files\Temurin"'

# Download and install Openfire directly from the installer URL
- name: Download Openfire installer
  ansible.windows.win_get_url:
    url: "{{ openfire_url }}"
    dest: 'C:\Windows\Temp\openfire-installer.exe'
    follow_redirects: all

- name: Install Openfire
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\openfire-installer.exe'
    arguments: '-q'
    state: present
    creates_path: '{{ openfire_path }}\bin\openfire-service.exe'
    wait_for_children: true

# Start the Openfire service and configure it to start whenever Windows boots.
- name: Start Openfire service
  ansible.windows.win_service:
    name: Openfire
    state: started
    start_mode: auto

# FEATURE 1 - WINDOWS FIREWALL MANAGEMENT
# Allow clients to connect to Openfire using TCP 5222
- name: Allow Openfire traffic through Windows Firewall
  community.windows.win_firewall_rule:
    name: "Openfire XMPP"
    localport: 5222
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

# FEATURE 2 - OPENFIRE CONFIGURATION MANAGEMENT
# Set the maximum memory Openfire can use to 1 GB.
- name: Configure Openfire memory
  ansible.windows.win_copy:
    content: "-Xmx1024m"
    dest: "{{ openfire_path }}\\bin\\openfire-service.vmoptions"
# Restart Openfire to apply the configuration.
- name: Restart Openfire
  ansible.windows.win_service:
    name: Openfire
    state: restarted