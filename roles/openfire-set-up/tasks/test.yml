- name: Check whether Openfire is already configured
  ansible.windows.win_powershell:
    script: |
      [xml]$xml = Get-Content -Raw "{{ openfire_path }}\conf\openfire.xml"
      $setup = $xml.SelectSingleNode('/jive/setup')
      $Ansible.Result = (
          $null -ne $setup -and $setup.InnerText -eq 'true'
      )
  register: openfire_setup_state
  changed_when: false

- name: Stop Openfire before initial configuration
  ansible.windows.win_service:
    name: Openfire
    state: stopped
  when: not openfire_setup_state.result

- name: Configure Openfire automatic setup
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      XmppDomain: "{{ openfire_domain }}"
      Hostname: "{{ openfire_fqdn }}"
      AdminEmail: "{{ openfire_admin_email }}"
      AdminPassword: "{{ openfire_admin_password }}"
    script: |
      param(
          [string]$XmppDomain,
          [string]$Hostname,
          [string]$AdminEmail,
          [string]$AdminPassword
      )

      $path = "{{ openfire_path }}\conf\openfire.xml"
      [xml]$xml = Get-Content -Raw $path
      $root = $xml.DocumentElement

      function Add-Element($parent, $name, $value) {
          $node = $xml.CreateElement($name)
          if ($null -ne $value) {
              $node.InnerText = [string]$value
          }
          [void]$parent.AppendChild($node)
          return $node
      }

      # Remove any incomplete autosetup configuration.
      $existing = $root.SelectSingleNode('autosetup')
      if ($null -ne $existing) {
          [void]$root.RemoveChild($existing)
      }

      $auto = Add-Element $root 'autosetup' $null
      [void](Add-Element $auto 'run' 'true')
      [void](Add-Element $auto 'locale' 'en')

      # XMPP server settings
      $xmpp = Add-Element $auto 'xmpp' $null
      [void](Add-Element $xmpp 'domain' $XmppDomain)
      [void](Add-Element $xmpp 'fqdn' $Hostname)

      $auth = Add-Element $xmpp 'auth' $null
      [void](Add-Element $auth 'anonymous' 'false')

      # Embedded database
      $database = Add-Element $auto 'database' $null
      [void](Add-Element $database 'mode' 'embedded')

      # Create Openfire administrator
      $admin = Add-Element $auto 'admin' $null
      [void](Add-Element $admin 'email' $AdminEmail)
      [void](Add-Element $admin 'password' $AdminPassword)

      # Use Openfire built-in user management
      $provider = Add-Element $auto 'authprovider' $null
      [void](Add-Element $provider 'mode' 'default')

      # Configure the HTTPS admin console
      $console = $root.SelectSingleNode('adminConsole')
      if ($null -eq $console) {
          $console = Add-Element $root 'adminConsole' $null
      }

      foreach ($setting in @{
          port = '-1'
          securePort = '9091'
      }.GetEnumerator()) {
          $node = $console.SelectSingleNode($setting.Key)
          if ($null -eq $node) {
              [void](Add-Element $console $setting.Key $setting.Value)
          }
          else {
              $node.InnerText = $setting.Value
          }
      }

      # Permit remote HTTPS access; restrict it using firewall rules.
      $interface = $console.SelectSingleNode('interface')
      if ($null -ne $interface) {
          [void]$console.RemoveChild($interface)
      }

      $xml.Save($path)
  when: not openfire_setup_state.result
  no_log: true

- name: Start Openfire and initialize database
  ansible.windows.win_service:
    name: Openfire
    state: started
    start_mode: auto

- name: Wait for automatic setup to finish
  ansible.windows.win_powershell:
    script: |
      [xml]$xml = Get-Content -Raw "{{ openfire_path }}\conf\openfire.xml"
      $setup = $xml.SelectSingleNode('/jive/setup')
      $Ansible.Result = (
          $null -ne $setup -and $setup.InnerText -eq 'true'
      )
  register: setup_result
  changed_when: false
  until: setup_result.result | default(false)
  retries: 30
  delay: 5