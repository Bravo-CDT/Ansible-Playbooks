---
# AD DC set up
- name: Install ADDS feature
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-Tools
      - RSAT-ADDS
    state: present
    include_management_tools: yes
  register: adds_install

- name: Reboot if AD DS installation requires it
  ansible.windows.win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 60
  when: adds_install.reboot_required | default(false)

- name: Create a new AD forest
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ netbios_name }}"
    safe_mode_password: "{{ safe_mode_password }}"
    install_dns: true
  register: domain_setup
  no_log: true

- name: Reboot after domain creation
  ansible.windows.win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 120
  when: domain_setup.reboot_required

- name: Wait for the server to come back online
  ansible.windows.win_wait_for:
    port: 5985
    delay: 10
    timeout: 300

# Grey Team Domain Users
- name: Create Grey Team Domain Users
  microsoft.ad.user:
    identity: "{{ item.identity }}"
    firstname: "{{ item.firstname }}"
    surname: "{{ item.surname }}"
    upn: "{{ item.identity }}@{{ domain_name }}"
    description: "This is a Grey Team user account. Please do not delete or modify this account."
    protect_from_deletion: true
    path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
    password: "{{ grey_team_users_password }}"
    password_never_expires: true
    user_cannot_change_password: false
    enabled: true
    state: present
    groups:
      add:
        - "Domain Admins"
        - "Enterprise Admins"
        - "Schema Admins"
  loop: "{{ grey_team_users }}"

# Blue Team Domain Admins
- name: Create Blue Team Domain Admins
  microsoft.ad.user:
    identity: "{{ item.identity }}"
    firstname: "{{ item.firstname }}"
    surname: "{{ item.surname }}"
    upn: "{{ item.identity }}@{{ domain_name }}"
    description: "{{ item.description }}"
    path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
    password: "{{ blue_team_admins_password }}"
    password_never_expires: true
    user_cannot_change_password: false
    enabled: true
    state: present
    groups:
      add:
        - "Domain Admins"
  loop: "{{ blue_team_admins }}"

# Blue Team Domain Users
- name: Create Blue Team Domain Users
  microsoft.ad.user:
    identity: "{{ item.identity }}"
    firstname: "{{ item.firstname }}"
    surname: "{{ item.surname }}"
    upn: "{{ item.identity }}@{{ domain_name }}"
    description: "{{ item.description }}"
    path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
    password: "{{ blue_team_users_password }}"
    password_never_expires: true
    user_cannot_change_password: false
    enabled: true
    state: present
    groups:
      add:
        - "Domain Users"
  loop: "{{ blue_team_users }}"

# Set up DNS Records for Linux Enviorment
- name: Create DNS A records for Linux machines
  ansible.windows.win_dns_record:
    name: "{{ hostvars[item].hostname }}"
    type: A
    value: "{{ item }}"
    zone: "{{ domain_name }}"
    state: present
  loop: "{{ groups['linux'] }}"

# Group Policy 
- name: Ensure GroupPolicy module is available
  ansible.windows.win_feature:
    name: GPMC
    state: present

# Locate NETLOGON on the domain controller
- name: Find NETLOGON share location
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    (Get-SmbShare -Name NETLOGON -ErrorAction Stop).Path
  register: netlogon_share
  changed_when: false

- name: Create domain theme directory
  ansible.windows.win_file:
    path: '{{ netlogon_share.stdout | trim }}\Theme-assets'
    state: directory

# Copy Cursor
- name: Copy cursor to NETLOGON
  ansible.windows.win_copy:
    src: "{{ cursor_path }}"
    dest: "{{ netlogon_share.stdout | trim }}\\Theme-assets\\cursor.cur"

# Configure Group Policy
- name: Create and configure domain theme GPO
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Import-Module GroupPolicy

    $GPOName = "Domain Theme Policy"
    $Domain = "{{ domain_name }}"
    $DomainDN = (($Domain -split '\.') | ForEach-Object { "DC=$_" }) -join ','

    $WallpaperPath = 'C:\ProgramData\SpongeBobTheme\wallpaper.jpg'
    $CursorUNC = "\\$Domain\NETLOGON\Theme-assets\cursor.cur"

    if (-not (Get-GPO -Name $GPOName -ErrorAction SilentlyContinue)) {
        New-GPO -Name $GPOName | Out-Null
    }

    Set-GPRegistryValue -Name $GPOName `
        -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System' `
        -ValueName 'Wallpaper' `
        -Type String -Value $WallpaperPath | Out-Null

    Set-GPRegistryValue -Name $GPOName `
        -Key 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System' `
        -ValueName 'WallpaperStyle' `
        -Type String -Value '10' | Out-Null

    Set-GPPrefRegistryValue -Name $GPOName `
        -Context User -Action Update `
        -Key 'HKCU\Control Panel\Cursors' `
        -ValueName 'Arrow' `
        -Type String -Value $CursorUNC | Out-Null

    $Link = (Get-GPInheritance -Target $DomainDN).GpoLinks |
        Where-Object { $_.DisplayName -eq $GPOName }

    if (-not $Link) {
        New-GPLink -Name $GPOName -Target $DomainDN | Out-Null
    }

    Set-GPLink -Name $GPOName -Target $DomainDN `
        -Enforced Yes | Out-Null