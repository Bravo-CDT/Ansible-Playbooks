# Wallpaper Stuff
- name: Create wallpaper directory
  ansible.windows.win_file:
    path: 'C:\ProgramData\SpongeBobTheme'
    state: directory

- name: Copy assigned wallpaper
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/Theme-assets/{{ wallpaper_file }}"
    dest: 'C:\ProgramData\SpongeBobTheme\wallpaper.jpg'

# AD DC set up
- name: Install ADDS feature
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-Tools
      - RSAT-ADDS
    state: present
    include_management_tools: yes

- name: Create a new AD forest
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ netbios_name }}"
    safe_mode_password: "{{ safe_mode_password }}"
    install_dns: true
  register: domain_setup
  no_log: true

- name: Reboot after domain creation
  ansible.windows.win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 120
  when: domain_setup.reboot_required

- name: Wait for the server to come back online
  ansible.windows.win_wait_for:
    port: 5986
    delay: 10
    timeout: 300

- name: Verify domain controller promotion
  ansible.windows.win_shell: |
    Get-ADDomainController -Filter * | Select-Object Name, Domain, Site
  register: dc_info

- name: Display domain controller information
  ansible.builtin.debug:
    var: dc_info.stdout_lines 

- name: if domain is not created, fail the playbook
  ansible.builtin.fail:
    msg: "Domain controller promotion failed. Please check the logs."
  when: dc_info.stdout_lines | length == 0

# Grey Team Domain Users
- name: Create Grey Team Domain Users
  microsoft.ad.user:
    identity: "{{ item.identity }}"
    firstname: "{{ item.firstname }}"
    surname: "{{ item.surname }}"
    upn: "{{ item.identity }}@{{ domain_name }}"
    description: "This is a Grey Team user account. Please do not delete or modify this account."
    protect_from_deletion: true
    path: "CN=Users,DC={{ domain_name.split('.')[0] }},DC={{ domain_name.split('.')[1] }}"
    password: "{{ item.password }}"
    password_never_expires: true
    user_cannot_change_password: false
    enabled: true
    state: present
    groups:
      add:
        - "Domain Admins"
        - "Enterprise Admins"
        - "Schema Admins"
  loop:
    - { identity: "kingneptune", firstname: "King", surname: "Neptune", password: "{{ grey_team_users_password }}" } # REPLACE WITH SECURE PASSWORD
    - { identity: "paintythepirate", firstname: "Paint", surname: "The Pirate", password: "{{ grey_team_users_password }}" } # REPLACE WITH SECURE PASSWORD

