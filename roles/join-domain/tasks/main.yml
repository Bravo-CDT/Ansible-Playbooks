# Join all windows boxes to a domain
---
- name: Create Local Users
  ansible.windows.win_user:
    name: grey
    password: "{{ local_user_password }}"
    state: present

- name: Add local user to Administrators
  ansible.windows.win_group_membership:
    name: Administrators
    members:
      - '.\grey'
    state: present

- name: Create wallpaper directory
  ansible.windows.win_file:
    path: 'C:\ProgramData\SpongeBobTheme'
    state: directory

- name: Copy assigned wallpaper
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/Theme-assets/{{ wallpaper_file }}"
    dest: 'C:\ProgramData\SpongeBobTheme\wallpaper.jpg'

- name: Change DNS settings
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - 192.168.1.10

- name: Join Windows Machines to Domain
  microsoft.ad.membership:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "{{ domain_admin_user }}@{{ domain_name }}"
    domain_admin_password: "{{ domain_admin_password }}"
    state: domain
    reboot: true
