# Join all windows boxes to a domain
---
- name: Join Windows Machines to Domain
  vars:
    domain_name: bravo.local # Replace with your domain name
    domain_admin_user: "kingneptune" # Replace with a domain admin user
    domain_admin_password: "Password123!" # Replace with the password for the domain admin user
  tasks:
    - name: Join Windows machine to domain
      ansible.microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ domain_admin_user }}@{{ domain_name }}"
        domain_admin_password: "{{ domain_admin_password }}"
        state: domain
        reboot: true

- name: Copy theme files to Windows Machines
  vars:
    theme_source_path: "./themes/bravo" # Replace with the path to your theme files
    theme_destination_path: "C:\\Themes\\bravo" # Replace with the desired destination path on the Windows machines
  tasks:
