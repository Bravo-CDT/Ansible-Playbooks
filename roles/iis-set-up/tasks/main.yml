---
#iis playbook
- name: Install IIS
  win_feature:
    name: Web-Server
    state: present
  register: iis_install

- name: Reboot if Required
  win_reboot:
  when: iis_install.reboot_required

- name: Starting and Enabling Service
  win_service:
    name: W3SVC
    start_mode: auto
    state: started

- name: "Index Page for Krusty Krab"
  win_copy:
    content:  |
      <html>
        <head><title> Krusty Krab </title></head>
        <body>
          <h1>Burgers</h1>
          <p>- Kelp Fries </p>
          <p>- Krabby Patty </p>
        </body>
      </html>
    dest: "{{ web_root }}//index.html"

- name: Request IIS certificate from Enterprise CA
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      param(
          [string]$DnsName,
          [string]$CAName
      )

      Import-Module PKI

      # Reuse a valid certificate issued by our CA
      $Cert = Get-ChildItem Cert:\LocalMachine\My |
          Where-Object {
              $_.HasPrivateKey -and
              $_.NotAfter -gt (Get-Date).AddDays(14) -and
              ($_.DnsNameList.Unicode -contains $DnsName) -and
              ($_.Issuer -match ("CN=" + [regex]::Escape($CAName)))
          } |
          Sort-Object NotAfter -Descending |
          Select-Object -First 1

      if (-not $Cert) {
          $Result = Get-Certificate `
              -Template WebServer `
              -DnsName $DnsName `
              -CertStoreLocation 'Cert:\LocalMachine\My' `
              -Url 'ldap:' `
              -ErrorAction Stop

          if ($Result.Status -ne 'Issued' -or -not $Result.Certificate) {
              throw "CA did not issue an IIS certificate."
          }

          $Cert = $Result.Certificate
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }

      $Ansible.Result = @{
          thumbprint = $Cert.Thumbprint
          subject    = $Cert.Subject
      }

    parameters:
      DnsName: "{{ web_dns_name }}"
      CAName: "{{ CACommonName }}"

  become: true
  become_method: runas
  become_user: "{{ domain_admin }}"
  register: iis_certificate


# Feature for HTTP + HTTPS Bindings
- name: Krusty Krab Website with HTTP + HTTPS bindings
  microsoft.iis.website:
    name: "Default Web Site"
    state: started
    bindings:
      add:
        - protocol: https
          ip: '*'
          port: 443
          hostname: "{{ web_dns_name }}"
          use_sni: true
          certificate_hash: "{{ iis_certificate.result.thumbprint }}"
          certificate_store_name: My

- name: Grant IIS server permission to enroll WebServer certificates
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      param([string]$ComputerAccount)

      $RootDSE = [ADSI]"LDAP://RootDSE"
      $ConfigDN = $RootDSE.configurationNamingContext

      $TemplatePath = "LDAP://CN=WebServer,CN=Certificate Templates,CN=Public Key Services,CN=Services,$ConfigDN"

      $Template = [ADSI]$TemplatePath
      $ACL = $Template.ObjectSecurity

      $SID = (New-Object System.Security.Principal.NTAccount($ComputerAccount)).Translate(
          [System.Security.Principal.SecurityIdentifier]
      )

      $Allow = [System.Security.AccessControl.AccessControlType]::Allow
      $Read = [System.DirectoryServices.ActiveDirectoryRights]::GenericRead
      $Enroll = [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight
      $EnrollGUID = [Guid]"0e10c968-78fb-11d2-90e4-00c04f79dc55"

      $Rules = $ACL.GetAccessRules(
          $true,
          $true,
          [System.Security.Principal.SecurityIdentifier]
      )

      $HasRead = @($Rules | Where-Object {
          $_.IdentityReference.Value -eq $SID.Value -and
          $_.AccessControlType -eq $Allow -and
          ($_.ActiveDirectoryRights -band $Read) -eq $Read
      }).Count -gt 0

      $HasEnroll = @($Rules | Where-Object {
          $_.IdentityReference.Value -eq $SID.Value -and
          $_.AccessControlType -eq $Allow -and
          ($_.ActiveDirectoryRights -band $Enroll) -ne 0 -and
          ($_.ObjectType -eq $EnrollGUID -or $_.ObjectType -eq [Guid]::Empty)
      }).Count -gt 0

      $Changed = $false

      if (-not $HasRead) {
          $ACL.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                  $SID, $Read, $Allow
              )
          )
          $Changed = $true
      }

      if (-not $HasEnroll) {
          $ACL.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                  $SID, $Enroll, $Allow, $EnrollGUID
              )
          )
          $Changed = $true
      }

      if ($Changed) {
          $Template.ObjectSecurity = $ACL
          $Template.CommitChanges()
      }

      $Ansible.Changed = $Changed

    parameters:
      ComputerAccount: "{{ iis_computer_account }}"

  become: true
  become_method: runas
  become_user: "{{ domain_admin }}@{{ domain_name }}"
  vars:
    ansible_become_password: "{{ domain_admin_password }}"