---
- name: Install Windows Telnet Client
  ansible.windows.win_feature:
    name: Telnet-Client
    state: present

- name: Download Cygwin installer
  ansible.windows.win_get_url:
    url: https://cygwin.com/setup-x86_64.exe
    dest: C:\Windows\Temp\cygwin-setup.exe

- name: Install Cygwin Telnet Server
  ansible.windows.win_command:
    cmd: >-
      C:\Windows\Temp\cygwin-setup.exe
      --quiet-mode
      --no-shortcuts
      --root C:\cygwin64
      --site https://mirrors.kernel.org/sourceware/cygwin/
      --packages inetutils-server,cygrunsrv
    creates: C:\cygwin64\usr\sbin\telnetd.exe

- name: Generate Cygwin passwd and group files for local and domain users
  ansible.windows.win_powershell:
    script: |
      & C:\cygwin64\bin\bash.exe -lc 'mkpasswd -l > /etc/passwd && mkpasswd -d >> /etc/passwd 2>/dev/null || true'
      & C:\cygwin64\bin\bash.exe -lc 'mkgroup -l > /etc/group && mkgroup -d >> /etc/group 2>/dev/null || true'

- name: Configure inetd Windows service
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      if (-not (Get-Service inetd -ErrorAction SilentlyContinue)) {
          & C:\cygwin64\bin\bash.exe -lc '/usr/bin/iu-config -y -w "{{ blue_team_admins_password }}"'

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure inetd"
          }
      }
  no_log: true

- name: Enable Telnet in inetd configuration
  community.windows.win_lineinfile:
    path: C:\cygwin64\etc\inetd.conf
    regexp: '^\s*#?\s*telnet\s+stream\s+tcp\s+'
    line: 'telnet stream tcp nowait root /usr/sbin/telnetd telnetd'
    state: present

- name: Allow Telnet through Windows Firewall
  ansible.windows.win_powershell:
    script: |
      if (-not (Get-NetFirewallRule -Name "CompetitionTelnet" -ErrorAction SilentlyContinue)) {
          New-NetFirewallRule `
            -Name "CompetitionTelnet" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 23 `
            -RemoteAddress Any `
            -Action Allow
      }

- name: Start and enable Telnet service
  ansible.windows.win_service:
    name: inetd
    username: LocalSystem
    start_mode: auto
    state: started