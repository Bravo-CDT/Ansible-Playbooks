---
# CA Set up
- name: Install the ADCS-Cert-Authority feature and RSAT tools
  ansible.windows.win_feature:
    name: ADCS-Cert-Authority
    include_management_tools: true
    state: present

# Making sure that the CA service is not already configured before attempting to configure it
- name: Check if CA service is already configured
  ansible.windows.win_service:
    name: CertSvc
  register: ca_service

# Configures AD CS Root CA
- name: Configure Enterprise Root CA
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Import-Module ADCSDeployment

    Install-AdcsCertificationAuthority `
      -CAType EnterpriseRootCA `
      -CACommonName "{{ CACommonName }}" `
      -CryptoProviderName "RSA#Microsoft Software Key Storage Provider" `
      -KeyLength 4096 `
      -HashAlgorithmName SHA256 `
      -OverwriteExistingKey `
      -Force
  become: true
  become_method: runas
  become_user: "{{ domain_admin }}"

- name: Ensure CA service is running
  ansible.windows.win_service:
    name: CertSvc
    start_mode: auto
    state: started

- name: Publish Web Server certificate template
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Import-Module ADCSAdministration

      $Template = Get-CATemplate |
          Where-Object { $_.Name -eq 'WebServer' }

      if (-not $Template) {
          Add-CATemplate -Name 'WebServer'
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }
  become: true
  become_method: runas
  become_user: "{{ domain_admin }}"

  # Find the newest CA certificate for export
- name: Get the thumbprint of the newest installed CA certificate
  ansible.windows.win_shell: |
    (Get-ChildItem -Path Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*{{ CACommonName }}*" } | Sort-Object NotBefore -Descending | Select-Object -First 1).Thumbprint.Trim()
  register: ca_thumbprint

# Export the root CA certificate to a temporary location on the Windows Server
- name: Export root CA certificate
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Thumbprint = "{{ ca_thumbprint.stdout_lines[0] | trim }}"

      $Cert = Get-ChildItem Cert:\LocalMachine\Root |
        Where-Object { $_.Thumbprint -eq $Thumbprint } |
        Select-Object -First 1

      if (-not $Cert) {
          throw "Root CA certificate not found: $Thumbprint"
      }

      $Path = 'C:\Windows\Temp\RootCA.pem'

      $Base64 = [Convert]::ToBase64String(
          $Cert.RawData,
          [Base64FormattingOptions]::InsertLineBreaks
      )

      $PEM = "-----BEGIN CERTIFICATE-----`r`n$Base64`r`n-----END CERTIFICATE-----`r`n"

      if (-not (Test-Path $Path) -or
          [IO.File]::ReadAllText($Path) -ne $PEM) {

          [IO.File]::WriteAllText($Path, $PEM)
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }

# Fetch the exported root CA certificate to the Ansible controller for the further distribution to client machines
- name: Copy Root CA to Ansible Controller
  ansible.builtin.fetch:
    src: C:\Windows\Temp\RootCA.pem 
    dest: "{{ playbook_dir }}/RootCA.pem" # Location on the Ansible controller where the root CA certificate will be stored, can be changed to any other location
    flat: true


- name: Grant IIS server permission to enroll WebServer certificates
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      param([string]$ComputerAccount)

      $RootDSE = [ADSI]"LDAP://RootDSE"
      $ConfigDN = $RootDSE.configurationNamingContext

      $TemplatePath = "LDAP://CN=WebServer,CN=Certificate Templates,CN=Public Key Services,CN=Services,$ConfigDN"

      $Template = [ADSI]$TemplatePath
      $ACL = $Template.ObjectSecurity

      $SID = (New-Object System.Security.Principal.NTAccount($ComputerAccount)).Translate(
          [System.Security.Principal.SecurityIdentifier]
      )

      $Allow = [System.Security.AccessControl.AccessControlType]::Allow
      $Read = [System.DirectoryServices.ActiveDirectoryRights]::GenericRead
      $Enroll = [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight
      $EnrollGUID = [Guid]"0e10c968-78fb-11d2-90e4-00c04f79dc55"

      $Rules = $ACL.GetAccessRules(
          $true,
          $true,
          [System.Security.Principal.SecurityIdentifier]
      )

      $HasRead = @($Rules | Where-Object {
          $_.IdentityReference.Value -eq $SID.Value -and
          $_.AccessControlType -eq $Allow -and
          ($_.ActiveDirectoryRights -band $Read) -eq $Read
      }).Count -gt 0

      $HasEnroll = @($Rules | Where-Object {
          $_.IdentityReference.Value -eq $SID.Value -and
          $_.AccessControlType -eq $Allow -and
          ($_.ActiveDirectoryRights -band $Enroll) -ne 0 -and
          ($_.ObjectType -eq $EnrollGUID -or $_.ObjectType -eq [Guid]::Empty)
      }).Count -gt 0

      $Changed = $false

      if (-not $HasRead) {
          $ACL.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                  $SID, $Read, $Allow
              )
          )
          $Changed = $true
      }

      if (-not $HasEnroll) {
          $ACL.AddAccessRule(
              [System.DirectoryServices.ActiveDirectoryAccessRule]::new(
                  $SID, $Enroll, $Allow, $EnrollGUID
              )
          )
          $Changed = $true
      }

      if ($Changed) {
          $Template.ObjectSecurity = $ACL
          $Template.CommitChanges()
      }

      $Ansible.Changed = $Changed

    parameters:
      ComputerAccount: "{{ iis_computer_account }}"

  become: true
  become_method: runas
  become_user: "{{ domain_admin }}@{{ domain_name }}"