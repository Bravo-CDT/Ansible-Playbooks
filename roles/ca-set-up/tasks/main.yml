---
# CA Set up
- name: Install the ADCS-Cert-Authority feature and RSAT tools
  ansible.windows.win_feature:
    name: ADCS-Cert-Authority
    include_management_tools: true
    state: present

# Making sure that the CA service is not already configured before attempting to configure it
- name: Check if CA service is already configured
  ansible.windows.win_service:
    name: CertSvc
  register: ca_service

# Configures AD CS Root CA
- name: Configure Enterprise Root CA
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Import-Module ADCSDeployment

    Install-AdcsCertificationAuthority `
      -CAType EnterpriseRootCA `
      -CACommonName "{{ CACommonName }}" `
      -CryptoProviderName "RSA#Microsoft Software Key Storage Provider" `
      -KeyLength 4096 `
      -HashAlgorithmName SHA256 `
      -Force
  become: true
  become_method: runas
  become_user: "{{ domain_admin }}"

- name: Ensure CA service is running
  ansible.windows.win_service:
    name: CertSvc
    start_mode: auto
    state: started

- name: Publish Web Server certificate template
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      Import-Module ADCSAdministration

      $Template = Get-CATemplate |
          Where-Object { $_.Name -eq 'WebServer' }

      if (-not $Template) {
          Add-CATemplate -Name 'WebServer'
          $Ansible.Changed = $true
      }
      else {
          $Ansible.Changed = $false
      }
  become: true
  become_method: runas
  become_user: "{{ domain_admin }}"

