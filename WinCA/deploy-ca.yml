---
- name: Install Active Directory Certificate Services (AD CS)
  hosts: windows_servers
  vars:
    CACommonName: "bravocdt-OM7755-WINSRV20-CA"  
  tasks:

    - name: Install the ADCS-Cert-Authority feature and RSAT tools
      ansible.windows.win_feature:
        name: ADCS-Cert-Authority
        include_management_tools: true
        state: present
      register: win_ca_install

    - name: Configure Standalone Root CA
      ansible.windows.win_shell: |
        Install-AdcsCertificationAuthority `
          -CAType StandaloneRootCA `
          -CACommonName "{{ CACommonName }}" `
          -CryptoProviderName "RSA#Microsoft Software Key Storage Provider" `
          -KeyLength 4096 `
          -HashAlgorithmName SHA256 `
          -DatabaseDirectory "C:\windows\system32\CertLog" `
          -LogDirectory "C:\windows\system32\CertLog" `
          -AllowAdministratorInteraction $false `
          -Force
      when: win_ca_install.changed

    - name: Get the thumbprint of the installed CA
      ansible.windows.win_shell: |
        (Get-ChildItem -Path Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*{{ CACommonName }}*" }).Thumbprint
      register: ca_thumbprint

    - name: Export root CA certificate
      ansible.windows.win_certificate_store:
        path: C:\Temp\RootCA.pem
        state: exported
        file_name: pem
        store_location: LocalMachine
        store_name: Root
        thumprint: "{{ ca_thumbprint.stdout }}"
      when: win_ca_install.changed

    - name: Fetch Root CA to Ansible Controler
      ansible.windows.win_fetch:
        src: C:\Temp\RootCA.pem
        dest: ./RootCA.pem
        flat: yes
      when: win_ca_install.changed

- name: Copy Root Certificate to Windows Machines
  hosts: windows_clients
  vars:
    path_to_root_cert: "./RootCA.pem"
  tasks:
    - name: Copy Root CA certificate to client machines
      ansible.windows.win_copy:
        src: "{{ path_to_root_cert }}"
        dest: "C:\\Temp\\RootCA.pem"

    - name: Import Root CA certificate into Trusted Root Certification Authorities
      ansible.windows.win_certificate_store:
        path: "C:\\Temp\\RootCA.pem"
        state: imported
        store_location: LocalMachine
        store_name: Root

- name: Copy Root Certificate to Linux Machines
  hosts: linux
  become: true
  vars:
    path_to_root_cert: "./RootCA.pem"
  tasks:
    - name: Copy Root CA certificate to client machines
      ansible.builytin.copy:
        src: "{{ path_to_root_cert }}"
        dest: "/usr/local/share/ca-certificates/RootCA.pem"
        owner: root
        group: root
        mode: '0644'
      register: ca_cert

    - name: Import Root CA certificate into Trusted Root Certification Authorities
      ansible.builytin.shell: |
        update-ca-certificates
      when: ca_cert.changed