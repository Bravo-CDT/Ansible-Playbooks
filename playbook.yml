---
- name: Create users
  hosts: linux
  vars:
    become: true
    path_to_root_cert: '/home/user/RootCA.pem' # Replace with user on ansible controller
    dc_ip: 10.111.2.1
    grey_team_password: "Anything" # Replace with something valid
    blue_team_password: "Patty321!"
    users:
      # Grey Team (Sudo)
      - name: kingneptune
        sudo: true
        password: "{{ grey_team_password }}"
      - name: paintythepirate
        sudo: true
        password: "{{ grey_team_password }}"

      # Blue Team Admins (Sudo)
      - name: mrkrabs
        sudo: true
        password: "{{ blue_team_password }}"
      - name: spongebob
        sudo: true
        password: "{{ blue_team_password }}"
      - name: squidward
        sudo: true
        password: "{{ blue_team_password }}"

      # Blue Team Standard Users (No Sudo)
      - name: patrick
        sudo: false
        password: "{{ blue_team_password }}"
      - name: sandy
        sudo: false
        password: "{{ blue_team_password }}"
      - name: pearl
        sudo: false
        password: "{{ blue_team_password }}"
  roles:
    - theme-set-up
  tags:
    - theme
    - full-deploy

- name: Set Up SMB
  hosts: shellphone
  vars:
    smb_username: spongebob #replace with any scored user
    smb_password: "Patty123!" # replace to follow packet
  roles:
    - smb-set-up
  tags:
    - smb
    - full-deploy

- name: Set up SMTP
  hosts: bottlemail
  become: true
  vars:
    ad_server: "treedome.krusty.krab"
    ad_search_base: "DC=krusty,DC=krab"
    ad_bind_user: "mrkrabs@krusty.krab"
    ad_bind_password: "Patty321!"
    smtp_hostname: "bottlemail.example.local"
  roles:
    - smtp-set-up
  tags:
    - smtp
    - full-deploy

# ansible-galaxy collection install community.postgresql
- name: Set Up PostgreSql
  hosts: pattyvault
  vars:
    become: true
    db_user: "bravo"
    db_password: "ANYTHING" # Replace
    db_name: "KrustySafe" # Replace

  roles:
    - postgresql-set-up
  tags:
    - sql
    - full-deploy

- name: Set Up Apache
  hosts: thesafe
  vars:
    team_name: "Bravo"
    comp_name: "CSEC473 Competition"
    apache_status: "Welcome to the Bravo Apache Web Server!"
  roles:
    - apache-set-up
  tags:
    - apache
    - full-deploy

