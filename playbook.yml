---
- name: Set Up SMB
  hosts: shellphone
  vars:
    smb_username: spongebob #replace with any scored user
    smb_password: "Patty123!" # replace to follow packet
  roles:
    - smb-set-up
  tags:
    - smb
    - full-deploy

- name: Set up SMTP
  hosts: bottlemail
  vars:
  roles:
    - smtp-set-up
  tags:
    - smtp
    - full-deploy

# ansible-galaxy collection install community.postgresql
- name: postgresql
  hosts: pattyvault
  vars:
    become: true
    db_user: "{{ lookup('ansible.builtin.env', 'DB_USER') | default('bravo', true) }}"
    db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
    db_name: "{{ lookup('ansible.builtin.env', 'DB_NAME') | default('bravo', true) }}"

  roles:
    - postgresql-set-up
  tags:
    - sql
    - full-deploy

