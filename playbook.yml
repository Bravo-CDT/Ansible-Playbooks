---
- name: Set up AD DC
  hosts: treedome
  vars: 
    shared_vars: &shared_vars
      domain_name: "KRUSTY.KRAB"
      local_user_password: "Password123!"
      ansible_passsword: "Password123!"
      domain_admin: "kingneptune"
    <<: *shared_vars
    netbios_name: KRUSTY
    safe_mode_password: "Password123!" #Replace with a secure password
    grey_team_users_password: "Password123!" #Replace with a secure password
    blue_team_admins_password: "Patty321!" #Replace with a secure password
    blue_team_users_password: "Patty321!" #Replace
    cursor_path: "{{ playbook_dir }}/Theme-assets/cursor.cur"
    ansible_user: Administrator
  roles:
    - dc-set-up
  tags:
    - dc
    - full-deploy

- name: Join Client to Domain
  hosts: windows_clients
  vars: 
    <<: *shared_vars
  roles:
    - join-domain
  tags:
    - join-domain
    - full-deploy

- name: Set Up CA
  hosts: orderwindow
  vars: 
    ca_shared: &ca_shared
      CACommonName: "KRUSTY-KRAB-CA"
      ansible_become_password: "Password123!"
    <<: *ca_shared
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
  roles:
    - ca-set-up
  tags:
    - ca
    - full-deploy

- name: Telnet service
  hosts: kelpdelivery
  vars:
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
  roles:
    - telnet-set-up
  tags:
    - telnet
    - full-deploy

# - name: FTP
