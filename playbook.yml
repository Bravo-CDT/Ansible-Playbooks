- name: IIS
  hosts: bubblechat
  vars:
    <<: *shared_vars
    <<: *ca_shared
    ansible_user: "{{ netbios_name }}\\Administrator"
    web_root: "C:/inetpub/wwwroot"
    web_dns_name: "bubblechat.{{ domain_name }}"
  roles:
    - iis-set-up
  tags:
    - iis
    - full-deploy

- name: Openfire
  hosts: treedome
  vars:
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
    java_url: "https://api.adoptium.net/v3/installer/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk" # URL used to download and install Java
    # URL used to download and install the Openfire Windows installer
    openfire_url: "https://download.igniterealtime.org/openfire/openfire_5_1_2_x64.exe"
    openfire_path: 'C:\Program Files\Openfire'
  roles:
    - openfire-set-up
  tags:
    - openfire
    - full-deploy