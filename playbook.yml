---
- name: "WIN - Minimal Facts"
  hosts: windows
  gather_facts: false

  tasks:
    - name: Gather minimal Windows facts
      setup:
        filter:
          - ansible_hostname
          - ansible_os_family

- name: Install theme assets and tools
  hosts: windows
  gather_facts: false
  vars:
    ansible_user: Administrator
    ansible_password: "IWant2Sleep!" 
  roles:
    - theme-and-tools
  tags:
    - theme
    - full-deploy

- name: Set up AD DC
  hosts: treedome
  gather_facts: false
  vars: 
    shared_vars: &shared_vars
      netbios_name: KRUSTY
      domain_name: "KRUSTY.KRAB"
      domain_admin: "{{ netbios_name }}\\kingneptune" # grey team admin
      local_user_password: "PineappleRush82!" # Used for Grey Team Local Admin
      blue_team_admins_password: "Patty321!" #Replace with a secure password
      ansible_password: "IWant2Sleep!" # Built in administator
      grey_team_users_password: "Pizza4Breakfast!" #Replace with a secure password
      ansible_become_password: "{{ grey_team_users_password }}"
    <<: *shared_vars
    safe_mode_password: "Coffee@Midnight8" #Replace with a secure password
    blue_team_users_password: "Patty321!" #Replace
    cursor_path: "{{ playbook_dir }}/Theme-assets/cursor.cur"
    ansible_user: Administrator
  roles:
    - dc-set-up
  tags:
    - dc
    - full-deploy

- name: Join Client to Domain
  hosts: windows_clients
  gather_facts: false
  vars: 
    <<: *shared_vars
    ansible_user: Administrator
    dc_ip: 10.111.2.1
  roles:
    - join-domain
  tags:
    - join-domain
    - full-deploy

- name: Set Up CA
  hosts: goldenspatula
  gather_facts: false
  vars: 
    ca_shared: &ca_shared
      CACommonName: "KRUSTY-KRAB-CA"
    <<: *ca_shared
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
    iis_computer_account: 'KRUSTY\ORDERWINDOW$'
  roles:
    - ca-set-up
  tags:
    - ca
    - full-deploy

# - name: Distribute CA ROOT cert with linux
#   hosts: linux
#   vars:
#     path_to_root_cert: "{{ playbook_dir }}./RootCA.pem"
#     become: true
#   roles:
#     - share-ca-cert
#   tags:
#     - ca-set-up
#     - share-root-cert
#     - full-deploy

- name: Telnet service
  hosts: kelpdelivery
  gather_facts: false
  vars:
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
  roles:
    - telnet-set-up
  tags:
    - telnet
    - full-deploy

- name: IIS
  hosts: orderwindow
  gather_facts: false
  vars:
    <<: *shared_vars
    <<: *ca_shared
    ansible_user: "{{ netbios_name }}\\Administrator"
    web_root: "C:/inetpub/wwwroot"
    web_dns_name: "bubblechat.{{ domain_name }}"
  roles:
    - iis-set-up
  tags:
    - iis
    - full-deploy

- name: Openfire
  hosts: bubblechat
  gather_facts: false
  vars:
    <<: *shared_vars
    ansible_user: "{{ netbios_name }}\\Administrator"
    java_url: "https://api.adoptium.net/v3/installer/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk" # URL used to download and install Java
    # URL used to download and install the Openfire Windows installer
    openfire_url: "https://download.igniterealtime.org/openfire/openfire_5_1_2_x64.exe"
    openfire_path: 'C:\Program Files\Openfire'
  roles:
    - openfire-set-up
  tags:
    - openfire
    - full-deploy