---
- name: Update packages
  hosts: linux
  become: true
  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
  tags:
    - update
    - full-deploy

- name: Create users
  hosts: linux
  become: true
  roles:
    - theme-set-up
  tags:
    - always
    - theme
    - full-deploy

- name: Set Up SMB
  hosts: shellphone
  become: true
  vars:
    smb_username: "{{ default_user }}"
    smb_password: "{{ default_password }}"
  roles:
    - smb-set-up
  tags:
    - smb
    - full-deploy

- name: Set up SMTP
  hosts: bottlemail
  become: true
  vars:
    ad_server: "treedome.krusty.krab"
    ad_search_base: "DC=krusty,DC=krab"
    ad_bind_user: "mrkrabs@krusty.krab"
    ad_bind_password: "{{ default_password }}"
    smtp_hostname: "bottlemail.krusty.krab"
  roles:
    - smtp-set-up
  tags:
    - smtp
    - full-deploy

# ansible-galaxy collection install community.postgresql
- name: Set Up PostgreSql
  hosts: pattyvault
  become: true
  vars:
    db_user: "{{ default_user }}"
    db_password: "{{ default_password }}"
    db_name: "KrustySafe" # Replace
    db_allowed_source: "10.111.0.0/16" # Subnet allowed to connect remotely

  roles:
    - postgresql-set-up
  tags:
    - sql
    - full-deploy

- name: Set Up Apache
  hosts: thesafe
  become: true
  vars:
    team_name: "Bravo"
    comp_name: "CSEC473 Competition"
    apache_status: "Welcome to the Bravo Apache Web Server!"
  roles:
    - apache-set-up
  tags:
    - apache
    - full-deploy

- name: Set Up Nginx
  hosts: krustyfront
  become: true
  roles:
    - nginx-set-up
  tags:
    - nginx
    - full-deploy
